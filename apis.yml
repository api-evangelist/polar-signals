aid: polar-signals
name: Polar Signals
description: >-
  Polar Signals is a continuous profiling company built by the team behind the
  open-source Parca project. Its Polar Signals Cloud product uses eBPF to
  continuously profile CPU, memory, and NVIDIA GPU workloads across Kubernetes,
  Docker, ECS, and bare metal with under 1% overhead and no code changes,
  storing profiles in the open-source FrostDB columnar database and querying
  them with Prometheus-style label selectors and PromQL. It exposes a
  gRPC/Connect API (published at buf.build/polarsignals/api) for managing
  organizations, projects, service accounts, roles, RBAC, and billing; a
  Parca-compatible profiling data plane at grpc.polarsignals.com; a hosted MCP
  server for AI-assisted performance analysis; language agents and SDKs for Go,
  Rust, Python, Node.js, JVM, .NET, PHP, Ruby and more; and the psctl CLI.
